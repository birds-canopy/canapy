[tool.poetry]
name = "canapy"
version = "0.1.0"
description = "canapy is a user friendly auto annotator for animal vocalizations using reservoir computing"
license = "BSD-3-Clause"
authors = [
  "Axel Arnaud <axel.arnaud@inria.fr>",
  "Nathan Trouvain <nathan.trouvain@inria.fr>",
  "Albane Arthuis <>",
  "Xavier Hinaut <xavier.hinaut@inria.fr>",
]
readme = "README.md"
packages = [
  { include = "canapy" },
  { include = "dashboard" },
  { include = "config" },
]
include = ["**/*.config.toml", "images/*.png"]

[tool.poetry.dependencies]
python = ">=3.11,<3.12"
setuptools = "68.2.2"
numba = "^0.58"
librosa = "0.10.2.post1"
scikit-learn = "1.7.2"
scipy = "1.15.3"
numpy = "1.26"
matplotlib = "3.10.7"
joblib = "1.5.2"
pandas = "2.3.3"
crowsetta = "5.1.0"
multimethod = "<2.0"
attrs = "23.2.0"
pandera = "0.15.2"
PyYAML = "6.0.3"
tqdm = "4.67.1"
reservoirpy = "^0.4.0"
hyperopt = "0.2.7"
jupyter = "1.1.1"
Levenshtein = "0.21.1"
panel = "1.2.3"
param = "1.13.0"
bokeh = "3.2.2"
toml = "0.10.2"
click = "8.3.1"
ipykernel = "6.29.4"
pydantic = "1.10.24"
requests = "2.32.5"
soundfile = "0.13.1"
audioread = "3.1.0"
pillow = "12.0.0"
py4j = "0.10.9.9"
pydub = "0.25.1"

[tool.poetry.group.dev.dependencies]
notebook = "7.5.0"

[tool.poetry.scripts]
canapy = "dashboard.__main__:cli"
canapy-audacity-convert = "audacity.main:main"

[tool.pytest.ini_options]
markers = [
    "slow: tests complets avec entraînement des annotateurs (SynAnnotator, NSynAnnotator, Ensemble)",
]

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
