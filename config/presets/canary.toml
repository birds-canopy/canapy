[misc]
seed=42

[transforms.annots]
time_precision=0.001 # seconds
min_label_duration=0.02 # seconds
lonely_labels=["cri", "TRASH"]
min_silence_gap=0.001 # seconds
silence_tag="SIL"

[transforms.audio]
audio_features=["mfcc", "delta", "delta2"]
sampling_rate=44100 # Hz
n_mfcc=13
hop_length=0.01 # seconds
win_length=0.02 # seconds
n_fft=2048 # audio frames
fmin=500 # Hz
fmax=8000 # Hz
lifter=40

[transforms.audio.delta]
padding="wrap"

[transforms.audio.delta2]
padding="wrap"

[transforms.training]
max_sequences=-1
test_ratio=0.2
iterative_fit = false

[transforms.training.balance]
min_silence_duration=0.2 # seconds

[transforms.training.balance.data_augmentation]
noise_std=0.01

[model.syn]
units=1000
sr=0.4
leak=0.1
iss=0.0005
isd=0.02
isd2=0.002
ridge=1e-8
backend="multiprocessing"
workers=-1

[model.nsyn]
units=1000
sr=0.4
leak=0.1
iss=0.0005
isd=0.02
isd2=0.002
ridge=1e-8
backend="multiprocessing"
workers=-1

[correction]
min_segment_proportion_agreement=0.66

[segmentation]
min_syllable_duration=0.004 # seconds
wiener_max=-0.2 # max spectral flatness; "otsu" reads it off the contour
band=[1500, 8000] # Hz
hop=0.0005 # seconds
eta2_min=0.5
group_syllables=false # true : the syllable is the repeated unit, not the acoustic element
pool_period=true # the repetition period is estimated per label, not per phrase
