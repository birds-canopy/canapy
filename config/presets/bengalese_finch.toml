[misc]
seed = 42

[correction]
min_segment_proportion_agreement = 0.66

[transforms.annots]
time_precision = 0.001
min_label_duration = 0.02
lonely_labels = [ "cri", "TRASH",]
min_silence_gap = 0.001
silence_tag = "SIL"
merge_consecutive_labels = false

[transforms.audio]
audio_features = [ "mfcc", "delta", "delta2",]
sampling_rate = 32000
n_mfcc = 13
hop_length = 0.005
win_length = 0.01
n_fft = 512
fmin = 1000
fmax = 8000
lifter = 40

[transforms.training]
max_sequences = -1
test_ratio = 0.2

[model.syn]
units = 1000
sr = "0.0015811764196343489"
leak = "0.25778097711499787"
iss = "0.0008130878918082826"
isd = "0.0014738437847588864"
isd2 = "0.052232133672901734"
ridge = "5.950126690338233e-08"
backend = "multiprocessing"
workers = -1
seed = 4365

[model.nsyn]
units = 1000
sr = 0.4
leak = 0.1
iss = 0.0005
isd = 0.02
isd2 = 0.002
ridge = 1e-8
backend = "multiprocessing"
workers = -1

[transforms.audio.delta]
padding = "wrap"

[transforms.audio.delta2]
padding = "wrap"

[transforms.training.balance]
min_class_total_duration = 2
min_silence_duration = 0.2

[transforms.training.balance.data_augmentation]
noise_std = 0.01
